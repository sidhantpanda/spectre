name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Vet
        working-directory: agent
        run: go vet ./...
      - name: Test
        working-directory: agent
        run: go test ./...
      - name: Build
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o spectre-agent .

  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Test
        working-directory: server
        run: npm test
      - name: Build
        working-directory: server
        run: npm run build
      - name: Docker build
        run: docker build ./server

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: web-ui
        run: npm ci
      - name: Lint
        working-directory: web-ui
        run: npm run lint
      - name: Test
        working-directory: web-ui
        run: npm test
      - name: Build
        working-directory: web-ui
        run: npm run build
      - name: Docker build
        run: docker build ./web-ui
