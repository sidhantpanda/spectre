# Local Compose stack built from source. `pnpm dev` is the faster inner loop;
# use this to test the built images.
#
# Auth is disabled here (SPECTRE_DEV_NO_AUTH=1), which the server refuses to
# honour when NODE_ENV=production. Never copy this file to a real deployment.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: spectre-server:dev
    environment:
      - PORT=8080
      # The server image sets NODE_ENV=production; SPECTRE_DEV_NO_AUTH is fatal
      # under it, so this stack has to opt back out.
      - NODE_ENV=development
      - SPECTRE_DEV_NO_AUTH=1
      - DATA_DIR=/data
      - TRUST_PROXY=1
    volumes:
      - server_data:/data
    expose:
      - "8080"

  web-ui:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    image: spectre-web-ui:dev
    environment:
      - SPECTRE_SERVER_HOST=
    expose:
      - "80"

  proxy:
    image: nginx:1.29.4-alpine
    depends_on:
      - server
      - web-ui
    # The only published port: UI, API and agents all arrive here, exactly as
    # they do in production.
    ports:
      - "3000:80"
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - SPECTRE_SERVER_UPSTREAM=server:8080
      - SPECTRE_WEB_UI_UPSTREAM=web-ui:80
      - NGINX_ENVSUBST_FILTER=^SPECTRE_

volumes:
  server_data:
