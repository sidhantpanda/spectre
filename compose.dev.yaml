services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: spectre-server:dev
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DATA_DIR=/data
    volumes:
      - server_data:/data

  web-ui:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    image: spectre-web-ui:dev
    ports:
      - "3000:80"
    environment:
      - SPECTRE_SERVER_HOST=http://localhost:8080

volumes:
  server_data:
