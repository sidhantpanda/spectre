name: Release Agent

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch: {}

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Set version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short_sha="${GITHUB_SHA::7}"
            echo "tag=agent-sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "version=agent-sha-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build agent binary
        run: |
          mkdir -p dist
          cd agent
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_ENABLED=0
          export VERSION="${{ needs.prepare.outputs.version }}"
          go build -ldflags "-X main.agentVersion=${VERSION}" -o ../dist/spectre-agent-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectre-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/spectre-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          for file in dist/**/* dist/*; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            chmod +x "$file"
            tar -C "$(dirname "$file")" -czf "upload/${base}.tar.gz" "$base"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Agent ${{ needs.prepare.outputs.version }}
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
