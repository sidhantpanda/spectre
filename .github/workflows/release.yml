name: Release

# A single tag releases everything. Push v1.2.3 to:
#   - build + push the server and web-ui Docker images to GHCR
#     (the proxy is stock nginx configured by compose; nothing to build)
#   - cross-compile the agent binaries
#   - publish one GitHub release (agent binaries attached)
#
# workflow_dispatch builds the same artifacts from the current commit but does
# not publish a GitHub release or move the `latest` image tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
      major: ${{ steps.meta.outputs.major }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Derive version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME#v}"
            is_release=true
          else
            short_sha="${GITHUB_SHA::7}"
            tag="v0.0.0-sha-${short_sha}"
            version="0.0.0-sha-${short_sha}"
            is_release=false
          fi
          IFS='.' read -r major minor _patch <<EOF
          $version
          EOF
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "major_minor=$major.$minor"
            echo "major=$major"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build ${{ matrix.component }} image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, web-ui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.is_release }}
            type=raw,value=${{ needs.prepare.outputs.major }},enable=${{ needs.prepare.outputs.is_release }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_release }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  agent:
    name: Build agent ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build agent binary
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p ../dist
          go build -ldflags "-X main.agentVersion=${VERSION}" \
            -o "../dist/spectre-agent-${GOOS}-${GOARCH}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectre-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/spectre-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, image, agent]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download agent artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package agent binaries
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          for file in dist/**/* dist/*; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            chmod +x "$file"
            tar -C "$(dirname "$file")" -czf "upload/${base}.tar.gz" "$base"
          done

      - name: Create release notes
        env:
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## Spectre ${{ github.ref_name }}

          ### Docker images

          Published to GitHub Container Registry (\`linux/amd64\` + \`linux/arm64\`):

          \`\`\`bash
          docker pull ${IMAGE_BASE}/server:${VERSION}
          docker pull ${IMAGE_BASE}/web-ui:${VERSION}
          \`\`\`

          ### Agent

          Install the agent on a remote machine and connect it in one line:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-agent.sh \\
            | sudo SPECTRE_AUTHKEY=sk_... bash -s -- --host wss://spectre.example.com
          \`\`\`

          Or install the binary only:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-agent.sh | sudo bash
          \`\`\`

          Prebuilt binaries for linux/darwin (amd64/arm64) are attached below.
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Spectre ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
