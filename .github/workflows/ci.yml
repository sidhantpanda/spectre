name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Vet
        working-directory: agent
        run: go vet ./...
      - name: Test
        working-directory: agent
        run: go test ./...
      - name: Build
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o spectre-agent .

  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web UI
        run: pnpm --filter @spectre/web-ui run lint
      - name: Build
        run: pnpm -r run build
      - name: Test
        run: pnpm -r run test

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile .
      - name: Build web UI image
        run: docker build -f web-ui/Dockerfile .
