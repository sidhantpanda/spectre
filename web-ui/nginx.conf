# Serves the UI and proxies the API to the control server.
#
# Everything is served from one origin: no CORS to configure, one port to
# expose, and one place to terminate TLS. __UPSTREAM__ is substituted at
# container start by docker-entrypoint.sh from SPECTRE_SERVER_UPSTREAM.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /env.js {
    add_header Cache-Control "no-store";
  }

  location ~ ^/(agents|terminal|auth|devices|authkeys|version|healthz)(/|$) {
    proxy_pass http://__UPSTREAM__;
    proxy_http_version 1.1;

    # Required for the terminal and agent-event WebSockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Terminal output is interactive and long-lived; don't buffer it or time
    # out an idle shell.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
