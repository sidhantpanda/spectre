# Serves the built UI as static files. Nothing else.
#
# This container is not reachable from outside the Docker network: the proxy
# container in front of it owns routing and forwards /api/* to the control
# server, so there is no API proxying to do here.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /env.js {
    add_header Cache-Control "no-store";
  }

  # Client-side routes (/enroll, /terminal/<id>, ...) are served by the SPA.
  location / {
    try_files $uri /index.html;
  }
}
